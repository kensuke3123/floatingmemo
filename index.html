<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>떠오르는 메모 보드</title>
<script>try{var s=localStorage.getItem('memo-theme');if(s)document.documentElement.dataset.theme=s}catch(e){}</script>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--dot:#f7c2cb;--sec:#fde6e6;--sec2:#fdd8cf;--field:#fffdfd;--ink:#6b4147;--sub:#a87d84;--line:#f3c6c9;--accent:#dd6670;--onacc:#fff;--shadow:0 4px 16px rgba(221,102,112,.15)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a2a2e;--dot:#a894d0;--sec:#4a3a6a;--sec2:#5e3a63;--field:#2f2540;--ink:#efe6fb;--sub:#bba9d6;--line:#6a5890;--accent:#b79cf0;--onacc:#2a1d44;--shadow:0 4px 16px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2a2a2e;--dot:#a894d0;--sec:#4a3a6a;--sec2:#5e3a63;--field:#2f2540;--ink:#efe6fb;--sub:#bba9d6;--line:#6a5890;--accent:#b79cf0;--onacc:#2a1d44;--shadow:0 4px 16px rgba(0,0,0,.35)}
:root{--glow:rgba(226,205,232,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:rgba(167,139,220,.35)}}
:root[data-theme="dark"]{--glow:rgba(167,139,220,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#8458c8;--onacc:#fbf6ff;--listmix:65%}}
:root[data-theme="dark"]{--accent:#8458c8;--onacc:#fbf6ff;--listmix:65%}
:root{--accent2:#f2a0a8;--onacc2:#fffdfd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent2:#9a6fd0;--onacc2:#fff}}
:root[data-theme="dark"]{--accent2:#9a6fd0;--onacc2:#fff}
:root{--histbg:#f2a0a8;--listbg:#fff;--fragA:#fff1f1;--fragB:#ffece6;--inbg:#fbd2d4;--themebg:#fde6e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--histbg:#33264d;--listbg:#2f2540;--fragA:#6c5992;--fragB:#6c5992;--inbg:#523f74;--themebg:#6a5594}}
:root[data-theme="dark"]{--histbg:#33264d;--listbg:#2f2540;--fragA:#6c5992;--fragB:#6c5992;--inbg:#523f74;--themebg:#6a5594}
:root{--histink:#fffdfd;--btnshadow:0 1px 1px rgba(150,60,70,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--histink:#efe6fb;--btnshadow:0 1px 1px rgba(25,12,50,.45)}}
:root[data-theme="dark"]{--histink:#efe6fb;--btnshadow:0 1px 1px rgba(25,12,50,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@property --bg{syntax:'<color>';inherits:true;initial-value:#fff}
@property --dot{syntax:'<color>';inherits:true;initial-value:#f7c2cb}
@property --sec{syntax:'<color>';inherits:true;initial-value:#fde6e6}
@property --sec2{syntax:'<color>';inherits:true;initial-value:#fdd8cf}
@property --field{syntax:'<color>';inherits:true;initial-value:#fffdfd}
@property --ink{syntax:'<color>';inherits:true;initial-value:#6b4147}
@property --sub{syntax:'<color>';inherits:true;initial-value:#a87d84}
@property --line{syntax:'<color>';inherits:true;initial-value:#f3c6c9}
@property --accent{syntax:'<color>';inherits:true;initial-value:#dd6670}
@property --onacc{syntax:'<color>';inherits:true;initial-value:#fff}
@property --glow{syntax:'<color>';inherits:true;initial-value:rgba(226,205,232,.55)}
@property --accent2{syntax:'<color>';inherits:true;initial-value:#f2a0a8}
@property --onacc2{syntax:'<color>';inherits:true;initial-value:#fffdfd}
@property --histbg{syntax:'<color>';inherits:true;initial-value:#f2a0a8}
@property --listbg{syntax:'<color>';inherits:true;initial-value:#fff}
@property --histink{syntax:'<color>';inherits:true;initial-value:#fffdfd}
@property --fragA{syntax:'<color>';inherits:true;initial-value:#fff1f1}
@property --fragB{syntax:'<color>';inherits:true;initial-value:#ffece6}
@property --inbg{syntax:'<color>';inherits:true;initial-value:#fbd2d4}
@property --themebg{syntax:'<color>';inherits:true;initial-value:#fde6e6}
:root{transition:--bg .7s ease,--dot .7s ease,--sec .7s ease,--sec2 .7s ease,--field .7s ease,--ink .7s ease,--sub .7s ease,--line .7s ease,--accent .7s ease,--onacc .7s ease,--glow .7s ease,--accent2 .7s ease,--onacc2 .7s ease,--histbg .7s ease,--listbg .7s ease,--histink .7s ease,--fragA .7s ease,--fragB .7s ease,--inbg .7s ease,--themebg .7s ease}
@media (prefers-reduced-motion:reduce){:root{transition:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;
background:var(--bg)}
body::before{content:"";position:fixed;inset:-6px;z-index:-1;pointer-events:none;background:radial-gradient(circle,var(--dot) 3px,transparent 3.5px) 0 0/28px 28px,radial-gradient(circle,var(--dot) 3px,transparent 3.5px) 14px 14px/28px 28px;filter:blur(1px)}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:18px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em;-webkit-text-stroke:6px var(--bg);paint-order:stroke fill}
.subtitle{margin:4px 0 0;color:var(--sub);font-size:.95rem;font-weight:600;-webkit-text-stroke:5px var(--bg);paint-order:stroke fill}
nav{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.tab{background:var(--sec);color:var(--ink);padding:8px 20px}
.tab.on{background:var(--accent);color:var(--onacc)}
section{background:var(--sec);border-radius:22px;padding:20px;margin-bottom:20px;box-shadow:0 0 8px 3px var(--glow)}
h2{margin:0 0 12px;font-size:1.05rem}
.histhead{margin:0 0 12px;color:var(--histink);text-shadow:var(--btnshadow)}
#histTab{display:flex;flex-direction:column;height:min(80vh,820px);min-height:420px;background:var(--histbg);border-radius:22px;padding:20px;margin-bottom:20px;box-shadow:0 0 8px 3px var(--glow)}
.histhead #hcount{font-size:.72em;font-weight:400}
#fragment{background:linear-gradient(135deg,var(--fragA),var(--fragB))}
#inputSec{background:var(--inbg)}
#fragment .inner{background:var(--field);border-radius:16px;padding:14px 16px;min-height:80px}
.empty{color:var(--sub);font-size:.92rem}
.ftitle{font-weight:700;margin:0 0 2px}
.date{color:var(--sub);font-size:.8rem}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:8px 16px;background:var(--accent);color:var(--onacc)}
button.ghost{background:var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
.btns{display:flex;gap:8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid var(--field)}
.pending{position:relative}
.pending button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;font-size:.7rem;background:var(--sub);color:#fff}
.memo{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px;margin-bottom:12px;background:var(--sec);box-shadow:var(--shadow)}
.memo:nth-child(even){background:var(--sec2)}
.memo .date{display:block}
.head{display:flex;align-items:center;gap:6px}
.head .ftitle{margin:0}
.icon{background:transparent;color:var(--sub);padding:4px;line-height:0;border-radius:8px}
.foot{display:flex;justify-content:flex-end;margin-top:10px}
.foot button{background:transparent;color:var(--sub);font-size:.85rem;padding:4px 10px}
.farewell{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--field) 94%,transparent);text-align:center;padding:12px}
.farewell p{margin:0;font-weight:700}
@keyframes fin{from{opacity:0}to{opacity:1}}
.farewell.gone p{animation:fin .6s ease}
#lightbox{position:fixed;inset:0;background:rgba(40,30,50,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:14px}
.note{font-size:.8rem;color:var(--sub);text-align:center;min-height:1.2em;margin:8px 0 0}
main>.note{font-weight:600;-webkit-text-stroke:4px var(--bg);paint-order:stroke fill}
#pickBtn,.attach{background:var(--accent2);color:var(--onacc2);font-weight:600;text-shadow:var(--btnshadow)}
.theme{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;padding:0;font-size:1.3rem;line-height:1;background:var(--themebg);color:var(--ink);box-shadow:0 0 8px 3px var(--glow)}
#list{flex:1;min-height:0;overflow-y:auto;padding:12px;border-radius:16px;background:var(--listbg)}
</style>
</head>
<body>
<main>
<header>
<button id="themeBtn" class="theme" type="button"></button>
<h1>떠오르는 메모 보드</h1>
<p class="subtitle">잃어버린 기억의 파편들을 주워드립니다</p>
</header>
<div id="homeTab">
<section id="fragment">
<h2>기억의 파편</h2>
<div class="inner" id="fragBox"></div>
<div class="row"><span class="date" id="fragHint">오늘의 파편이에요</span><button id="pickBtn" class="ghost">다른 기억 줍기</button></div>
</section>
<section id="inputSec">
<h2>기억의 바다에 메모지를 띄워보세요</h2>
<input type="text" id="title" placeholder="제목" maxlength="60">
<textarea id="content" placeholder="내용"></textarea>
<div class="thumbs" id="pendingThumbs"></div>
<div class="row">
<input type="file" id="file" accept="image/*" multiple hidden>
<button type="button" class="attach" id="attachBtn">사진 첨부 (<span id="cnt">0</span>/4)</button>
<button id="postBtn">올리기</button>
</div>
<p class="note" id="status"></p>
</section>
</div>

<div id="histTab">
<h2 class="histhead">히스토리 <span id="hcount">0</span></h2>
<div id="list"></div>
</div>
<p class="note">메모는 이 기기의 브라우저에만 저장돼요.</p>
</main>
<div id="lightbox"><img alt=""></div>

<script>
(function(){
var MAX=4,memos=[],pending=[],db=null,curId=null,picked=false;
var $=function(i){return document.getElementById(i)};
var PENCIL='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

/* 테마 전환 */
var root=document.documentElement;
function curTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintToggle(){var d=curTheme()==='dark';$('themeBtn').textContent=d?'\u263d':'\u2600\ufe0e';$('themeBtn').setAttribute('aria-label',d?'라이트 모드로 전환':'다크 모드로 전환')}
$('themeBtn').onclick=function(){var n=curTheme()==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('memo-theme',n)}catch(e){}paintToggle()};
try{var saved=localStorage.getItem('memo-theme');if(saved)root.dataset.theme=saved}catch(e){}
paintToggle();

/* 저장소: IndexedDB (실패하면 이번 접속 동안만 메모리에 보관) */
function openDB(){return new Promise(function(res){
  try{var r=indexedDB.open('memo-board',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('memos',{keyPath:'id'})};
    r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()};
  }catch(e){res()}
})}
function loadAll(){return new Promise(function(res){
  if(!db)return res([]);
  try{var q=db.transaction('memos').objectStore('memos').getAll();
    q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])};
  }catch(e){res([])}
})}
function put(m){if(!db)return;try{db.transaction('memos','readwrite').objectStore('memos').put(m)}catch(e){}}
function remove(id){if(!db)return;try{db.transaction('memos','readwrite').objectStore('memos').delete(id)}catch(e){}}

/* 유틸 */
function fmt(t){var d=new Date(t);return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function ago(t){var n=Math.floor((Date.now()-t)/864e5);if(n<1)return'오늘';if(n<30)return n+'일 전';if(n<365)return Math.floor(n/30)+'개월 전';return Math.floor(n/365)+'년 전'}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function shrink(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=function(){URL.revokeObjectURL(url);rej()};img.src=url;
})}
function zoom(src){var lb=$('lightbox');lb.firstElementChild.src=src;lb.classList.add('on')}
$('lightbox').onclick=function(){this.classList.remove('on')};
function thumbs(photos){var w=el('div','thumbs');photos.forEach(function(p){var i=el('img');i.src=p;i.alt='첨부 사진';i.onclick=function(){zoom(p)};w.appendChild(i)});return w}
function addPhotos(files,arr,done){
  var fs=Array.prototype.slice.call(files).slice(0,MAX-arr.length);
  Promise.all(fs.map(function(f){return shrink(f).catch(function(){return null})})).then(function(r){
    r.forEach(function(p){if(p&&arr.length<MAX)arr.push(p)});done();
  });
}
function drawPhotos(host,arr,cnt){
  host.innerHTML='';cnt.textContent=arr.length;
  arr.forEach(function(p,i){
    var b=el('div','pending'),im=el('img');im.src=p;im.alt='';
    var x=el('button',null,'✕');x.setAttribute('aria-label','사진 빼기');
    x.onclick=function(){arr.splice(i,1);drawPhotos(host,arr,cnt)};
    b.appendChild(im);b.appendChild(x);host.appendChild(b);
  });
}

/* 기억의 파편: 날짜가 바뀌면 다른 메모, 버튼으로 다시 뽑기 */
function dayIndex(n){var k=new Date().toDateString(),h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return h%n}
function renderFragment(){
  var box=$('fragBox');box.innerHTML='';
  if(!memos.length){box.appendChild(el('p','empty','아직 떠오를 기억이 없어요. 아래에 첫 메모를 띄워보세요.'));$('pickBtn').disabled=true;return}
  $('pickBtn').disabled=memos.length<2;
  var m=memos.find(function(x){return x.id===curId});
  if(!m){m=memos[dayIndex(memos.length)];curId=m.id}
  box.appendChild(el('p','ftitle',m.title||'(제목 없음)'));
  box.appendChild(el('span','date',fmt(m.t)+' · '+ago(m.t)));
  if(m.content)box.appendChild(el('p','body',m.content));
  if(m.photos&&m.photos.length)box.appendChild(thumbs(m.photos));
  $('fragHint').textContent=picked?'방금 주운 기억이에요':'오늘의 파편이에요';
}
$('pickBtn').onclick=function(){
  if(memos.length<2)return;var m;
  do{m=memos[Math.floor(Math.random()*memos.length)]}while(m.id===curId);
  curId=m.id;picked=true;renderFragment();
};

/* 메모 수정 */
function editCard(m,c){
  c.innerHTML='';
  var draft=(m.photos||[]).slice(),t=el('input'),ta=el('textarea'),host=el('div','thumbs'),f=el('input'),cnt=el('span',null,'0');
  t.type='text';t.value=m.title||'';t.maxLength=60;t.placeholder='제목';
  ta.value=m.content||'';ta.placeholder='내용';
  f.type='file';f.accept='image/*';f.multiple=true;f.hidden=true;
  var at=el('button','attach');at.type='button';at.append('사진 첨부 (',cnt,'/4)');
  at.onclick=function(){f.click()};
  f.onchange=function(e){addPhotos(e.target.files,draft,function(){drawPhotos(host,draft,cnt)});e.target.value=''};
  var save=el('button',null,'저장'),cancel=el('button','ghost','취소'),row=el('div','row'),bt=el('div','btns');
  save.onclick=function(){m.title=t.value.trim();m.content=ta.value.trim();m.photos=draft;put(m);renderAll()};
  cancel.onclick=renderAll;
  drawPhotos(host,draft,cnt);
  bt.appendChild(cancel);bt.appendChild(save);row.appendChild(at);row.appendChild(bt);
  [t,ta,host,row,f].forEach(function(n){c.appendChild(n)});
  t.focus();
}

/* 히스토리 */
function renderList(){
  var l=$('list');l.innerHTML='';$('hcount').textContent=memos.length;
  if(!memos.length)l.appendChild(el('p','empty','아직 쌓인 기억이 없어요.'));
  memos.forEach(function(m){
    var c=el('article','memo'),h=el('div','head');
    h.appendChild(el('p','ftitle',m.title||'(제목 없음)'));
    var ed=el('button','icon');ed.innerHTML=PENCIL;ed.setAttribute('aria-label','메모 수정');
    ed.onclick=function(){editCard(m,c)};
    h.appendChild(ed);c.appendChild(h);c.appendChild(el('span','date',fmt(m.t)));
    if(m.content)c.appendChild(el('p','body',m.content));
    if(m.photos&&m.photos.length)c.appendChild(thumbs(m.photos));
    var foot=el('div','foot'),d=el('button',null,'작별하기');
    d.onclick=function(){
      if(c.querySelector('.farewell'))return;
      var ov=el('div','farewell'),bt=el('div','btns');
      var yes=el('button',null,'작별하기'),no=el('button','ghost','남겨두기');
      yes.onclick=function(){
        memos=memos.filter(function(x){return x.id!==m.id});remove(m.id);
        if(curId===m.id)curId=null;
        ov.className='farewell gone';ov.innerHTML='';
        ov.appendChild(el('p',null,'메모지가 먼 곳으로 떠나갔습니다.'));
        c.style.transition='opacity .5s ease';
        setTimeout(function(){c.style.opacity='0'},1300);
        setTimeout(renderAll,1800);
      };
      no.onclick=function(){ov.remove()};
      bt.appendChild(yes);bt.appendChild(no);
      ov.appendChild(el('p',null,'정말 작별하시겠습니까?'));ov.appendChild(bt);c.appendChild(ov);
    };
    foot.appendChild(d);c.appendChild(foot);l.appendChild(c);
  });
}
function renderAll(){renderFragment();renderList()}

/* 새 메모 */
$('attachBtn').onclick=function(){$('file').click()};
$('file').onchange=function(e){addPhotos(e.target.files,pending,function(){drawPhotos($('pendingThumbs'),pending,$('cnt'))});e.target.value=''};
$('postBtn').onclick=function(){
  var t=$('title').value.trim(),c=$('content').value.trim();
  if(!t&&!c&&!pending.length)return;
  var m={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),t:Date.now(),title:t,content:c,photos:pending.slice()};
  memos.unshift(m);put(m);
  $('title').value='';$('content').value='';pending=[];drawPhotos($('pendingThumbs'),pending,$('cnt'));
  renderAll();
  $('status').textContent='메모지를 띄웠어요 ✓';
  setTimeout(function(){$('status').textContent=''},2000);
};

openDB().then(loadAll).then(function(r){
  memos=r.sort(function(a,b){return b.t-a.t});renderAll();
});
})();
</script>
</body>
</html>
